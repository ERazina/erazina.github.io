<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111318" />
    <meta
      name="description"
      content="Launchpad — an interactive product delivery workspace by Elina Razina."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://erazina.github.io/app/" />
    <link rel="icon" href="/favicon.svg" />
    <title>Launchpad — Interactive Product Demo</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("launchpad-demo-theme");
        document.documentElement.dataset.appTheme =
          savedTheme ||
          (matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark");
      } catch {
        document.documentElement.dataset.appTheme = "dark";
      }
    </script>
    <script type="module" src="/src/app-demo/main.jsx"></script>
  </head>
  <body>
    <div id="product-demo-root"></div>
    <noscript>Enable JavaScript to explore this interactive product demo.</noscript>
  </body>
</html>
