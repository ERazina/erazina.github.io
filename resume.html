<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Элина Разина — Lead Frontend Engineer. React, TypeScript, Next.js."
    />
    <meta name="theme-color" content="#f4f1ea" />

    <meta property="og:title" content="Элина Разина — Lead Frontend Engineer" />
    <meta
      property="og:description"
      content="React, TypeScript, Next.js. Открыта к новым предложениям."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://erazina.github.io/resume" />

    <title>Элина Разина — Lead Frontend Engineer</title>

    <style>
      :root {
        --background: #f4f1ea;
        --surface: #fffdf9;
        --surface-hover: #f8f4ed;
        --text: #202024;
        --muted: #68666b;
        --soft: #8b8780;
        --line: #ded9cf;
        --accent: #f15b2a;
        --accent-dark: #d94719;
        --status: #39a85a;
        --status-ring: rgba(57, 168, 90, 0.28);
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        display: grid;
        place-items: center;
        color: var(--text);
        background-color: var(--background);
        background-image: radial-gradient(
          rgba(32, 32, 36, 0.055) 0.7px,
          transparent 0.7px
        );
        background-size: 18px 18px;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      a {
        color: inherit;
      }

      .page {
        position: relative;
        width: min(960px, 100%);
        min-height: 610px;
        padding: clamp(30px, 7vw, 74px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        box-shadow:
          0 2px 0 rgba(255, 255, 255, 0.9) inset,
          0 24px 60px rgba(62, 51, 38, 0.12);
      }

      .page::after {
        content: "";
        position: absolute;
        top: 0;
        right: clamp(28px, 7vw, 70px);
        width: 76px;
        height: 5px;
        background: var(--accent);
        transform: rotate(-1.5deg);
        transform-origin: right center;
      }

      .topline {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: clamp(54px, 8vw, 92px);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        color: #55535a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.075em;
        text-transform: uppercase;
      }

      .status-dot {
        position: relative;
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: var(--status);
        box-shadow: 0 0 0 3px rgba(57, 168, 90, 0.09);
      }

      .status-dot::after {
        content: "";
        position: absolute;
        inset: -6px;
        border: 1px solid var(--status-ring);
        border-radius: inherit;
        animation: status-pulse 2.2s cubic-bezier(0.2, 0.7, 0.3, 1) infinite;
      }

      @keyframes status-pulse {
        0% {
          opacity: 0;
          transform: scale(0.55);
        }
        18% {
          opacity: 1;
        }
        78%,
        100% {
          opacity: 0;
          transform: scale(1.45);
        }
      }

      .experience {
        color: var(--soft);
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }

      h1 {
        max-width: 790px;
        margin: 0;
        font-size: clamp(50px, 9vw, 94px);
        line-height: 0.93;
        letter-spacing: -0.064em;
        font-weight: 780;
      }

      .role {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: clamp(23px, 4vw, 37px);
        line-height: 1.2;
        letter-spacing: -0.028em;
        font-weight: 580;
      }

      .companies {
        margin: 13px 0 0;
        color: var(--soft);
        font-size: 14px;
        line-height: 1.5;
      }

      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 37px;
      }

      .stack span {
        padding: 9px 13px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #faf7f1;
        color: #454349;
        font-size: 14px;
        font-weight: 650;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 43px;
      }

      .button {
        min-height: 52px;
        padding: 0 19px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid #cbc5bb;
        border-radius: 11px;
        background: transparent;
        color: var(--text);
        text-decoration: none;
        font-size: 15px;
        font-weight: 700;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background-color 160ms ease;
      }

      .button svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }

      .button:hover {
        transform: translateY(-2px);
        border-color: #aaa399;
        background: var(--surface-hover);
      }

      .button:focus-visible {
        outline: 3px solid rgba(241, 91, 42, 0.2);
        outline-offset: 3px;
      }

      .button-primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
        box-shadow: 0 8px 20px rgba(241, 91, 42, 0.18);
      }

      .button-primary:hover {
        border-color: var(--accent-dark);
        background: var(--accent-dark);
      }

      .footer {
        margin-top: clamp(62px, 9vw, 96px);
        padding-top: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border-top: 1px solid var(--line);
        color: var(--soft);
        font-size: 12px;
      }

      .footer a {
        text-decoration: none;
      }

      .footer a:hover {
        color: var(--text);
      }

      @media (max-width: 640px) {
        body {
          padding: 12px;
          place-items: start center;
        }

        .page {
          min-height: calc(100vh - 24px);
          padding: 28px 22px 24px;
          border-radius: 20px;
        }

        .topline {
          align-items: flex-start;
          margin-bottom: 70px;
        }

        .experience {
          max-width: 90px;
          text-align: right;
          white-space: normal;
        }

        h1 {
          font-size: clamp(49px, 17vw, 72px);
        }

        .companies {
          max-width: 260px;
        }

        .actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        .button-primary {
          grid-column: 1 / -1;
        }

        .footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
      }

      @media (max-width: 390px) {
        .actions {
          grid-template-columns: 1fr;
        }

        .button-primary {
          grid-column: auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

      </div>

      <footer class="footer">
        <span>Санкт-Петербург · Remote / Hybrid</span>
        <span>erazina.github.io/resume</span>
      </footer>
    </main>
  </body>
</html>
