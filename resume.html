<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Элина Разина — Lead Frontend Engineer. React, TypeScript, Next.js."
    />
    <title>Элина Разина — Lead Frontend Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0b0f;
        --card: rgba(255, 255, 255, 0.06);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f7f7fb;
        --muted: #a8a8b3;
        --accent: #ff6a2a;
        --accent-2: #ff8a4c;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: radial-gradient(
            circle at 15% 20%,
            rgba(255, 106, 42, 0.18),
            transparent 35%
          ),
          radial-gradient(
            circle at 85% 10%,
            rgba(255, 138, 76, 0.1),
            transparent 30%
          ),
          linear-gradient(135deg, #0b0b0f 0%, #111118 55%, #09090d 100%);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .page {
        width: min(980px, 100%);
        min-height: 620px;
        padding: clamp(28px, 6vw, 72px);
        border: 1px solid var(--line);
        border-radius: 32px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.07),
          rgba(255, 255, 255, 0.03)
        );
        backdrop-filter: blur(18px);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.45);
        position: relative;
        overflow: hidden;
      }

      .page::before {
        content: "";
        position: absolute;
        width: 280px;
        height: 280px;
        right: -90px;
        top: -100px;
        border-radius: 50%;
        background: rgba(255, 106, 42, 0.18);
        filter: blur(10px);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 28px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 20px rgba(255, 106, 42, 0.75);
      }

      h1 {
        font-size: clamp(48px, 8vw, 92px);
        line-height: 0.94;
        letter-spacing: -0.055em;
        margin: 0 0 24px;
        max-width: 760px;
      }

      .role {
        font-size: clamp(24px, 4vw, 38px);
        line-height: 1.15;
        color: var(--muted);
        margin: 0 0 34px;
        font-weight: 600;
      }

      .stack {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 46px;
      }

      .stack span {
        padding: 10px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        font-weight: 600;
        font-size: 15px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        padding: 0 22px;
        border-radius: 14px;
        border: 1px solid var(--line);
        color: var(--text);
        text-decoration: none;
        font-weight: 700;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease,
          background-color 0.2s ease;
      }

      .button:hover {
        transform: translateY(-2px);
        border-color: rgba(255, 255, 255, 0.3);
        background: rgba(255, 255, 255, 0.08);
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #111;
        border-color: transparent;
        box-shadow: 0 14px 34px rgba(255, 106, 42, 0.22);
      }

      .footer {
        margin-top: 72px;
        color: #777783;
        font-size: 13px;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px;
        }

        .page {
          min-height: auto;
          border-radius: 24px;
          padding: 28px 22px 24px;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }

        .footer {
          margin-top: 48px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="eyebrow">
        <span class="dot"></span>
        Open to work
      </div>

      <h1>Элина Разина</h1>
      <p class="role">Lead Frontend Engineer</p>

      <div class="stack" aria-label="Основной стек">
        <span>React</span>
        <span>TypeScript</span>
        <span>Next.js</span>
      </div>

      <div class="actions">
        <a
          class="button primary"
          href="./Elina_Razina_Resume.pdf"
          target="_blank"
          rel="noopener"
        >
          Скачать PDF
        </a>
        <a
          class="button"
          href="https://github.com/erazina"
          target="_blank"
          rel="noopener"
        >
          GitHub
        </a>
        <a
          class="button"
          href="https://t.me/Elina_Razina"
          target="_blank"
          rel="noopener"
        >
          Telegram
        </a>
      </div>

      <div class="footer">Санкт-Петербург · Remote / Hybrid</div>
    </main>
  </body>
</html>
